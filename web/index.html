<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f5e8" />
    <title>Admiral</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        --bg: #f9f5e8;
        --card: #fff9ee;
        --ink: #1d2418;
        --muted: #5b644f;
        --ok: #2f8f46;
        --warn: #c57e13;
        --danger: #bf2f2f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, #fffef6 0, transparent 30%),
          radial-gradient(circle at 90% 20%, #ffeec9 0, transparent 40%),
          var(--bg);
        min-height: 100vh;
        padding: 24px;
      }
      .shell {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid #e8d9bc;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 8px 20px rgba(94, 71, 31, 0.08);
      }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      h1 { margin: 0; font-size: 28px; letter-spacing: 0.4px; }
      .muted { color: var(--muted); }
      .pill {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #d4c5a6;
        background: #fff;
        font-size: 13px;
      }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      .danger { color: var(--danger); }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        background: #3a5f22;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary { background: #5d6f47; }
      button.danger { background: #922a2a; }
      input {
        border: 1px solid #ccb993;
        border-radius: 10px;
        padding: 10px;
        width: 280px;
      }
      pre {
        background: #fff;
        border: 1px solid #e8d9bc;
        border-radius: 12px;
        padding: 12px;
        margin: 0;
        overflow: auto;
        max-height: 320px;
      }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      button.busy { opacity: 0.75; cursor: wait; }
      .error-banner {
        background: #fdecea;
        border: 1px solid #f5a7a7;
        border-radius: 10px;
        color: var(--danger);
        padding: 10px 14px;
        font-size: 13px;
        display: none;
      }
      .session-standdown-pill {
        background: #fff3cd;
        border: 1px solid #f0c040;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        color: #7a5c00;
        display: none;
        align-items: center;
        gap: 8px;
      }
      .status-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .stat-box {
        background: #fff;
        border: 1px solid #e8d9bc;
        border-radius: 12px;
        padding: 10px 14px;
      }
      .stat-box .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
      .stat-box .value { font-size: 18px; font-weight: 700; }
      .stat-box .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
      details > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 10px 0 6px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card row" style="justify-content: space-between">
        <div>
          <h1>Admiral</h1>
          <div class="muted">Presence handoff controller</div>
        </div>
        <div id="hbState" class="pill">Heartbeat: unknown</div>
      </div>

      <div id="loginCard" class="card">
        <div class="row">
          <input id="tokenInput" type="password" placeholder="Access token" />
          <button id="loginBtn">Unlock</button>
        </div>
        <div class="muted" style="margin-top: 8px">Token is exchanged for an HttpOnly session cookie.</div>
      </div>

      <div id="appCard" class="card hidden">
        <div id="errorBanner" class="error-banner" style="margin-bottom: 10px"></div>
        <div class="row" style="margin-bottom: 10px; flex-wrap: wrap">
          <button id="joinBtn">Force Join</button>
          <button id="leaveBtn" class="danger">Force Leave</button>
          <button id="standdownOnBtn" class="secondary">Standdown On</button>
          <button id="standdownOffBtn" class="secondary">Standdown Off</button>
          <button id="standdownSessionBtn" class="secondary">Stand Down This Session</button>
          <button id="cancelSessionStanddownBtn" class="secondary hidden">Cancel Session Stand-Down</button>
          <button id="openJoinBtn" class="secondary">Join Myself</button>
          <button id="logoutBtn" class="secondary" style="margin-left: auto">Log Out</button>
        </div>
        <div class="row" style="margin-bottom: 12px; flex-wrap: wrap; gap: 8px">
          <div id="siteTime" class="pill">IST time: --</div>
          <div id="upcomingClass" class="pill">Upcoming: --</div>
          <div id="sessionStanddownPill" class="session-standdown-pill"></div>
        </div>
        <div class="status-summary">
          <div class="stat-box">
            <div class="label">State</div>
            <div class="value" id="statState">--</div>
            <div class="sub" id="statReason"></div>
          </div>
          <div class="stat-box">
            <div class="label">Active class</div>
            <div class="value" id="statClass">--</div>
            <div class="sub" id="statClassTime"></div>
          </div>
          <div class="stat-box">
            <div class="label">Participants</div>
            <div class="value" id="statParticipants">--</div>
            <div class="sub" id="statDuplicate"></div>
          </div>
          <div class="stat-box">
            <div class="label">Next class in</div>
            <div class="value" id="statCountdown">--</div>
            <div class="sub" id="statCountdownClass"></div>
          </div>
        </div>
        <details>
          <summary>Raw status &amp; schedule JSON</summary>
          <pre id="statusPre">Loading...</pre>
          <div class="muted" style="margin-top: 8px; margin-bottom: 4px">Parsed schedule</div>
          <pre id="schedulePre">Loading...</pre>
        </details>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
