<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Admiral — Today</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #000000;
        --accent: #1c1c84;
        /* Semantic signal tokens (same palette as status page). */
        --st-out:     #6b6b6b;
        --st-joining: #b45309;
        --st-inroom:  #1d4ed8;
        --st-leaving: #15803d;
        --warn:       #b45309;
        --danger:     #b91c1c;
        --muted:      #6b6b6b;
      }
      * { box-sizing: border-box; border-radius: 0 !important; }
      ::selection { background: var(--accent); color: #ffffff; }
      body {
        margin: 0;
        font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--bg); min-height: 100vh;
      }
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap;
        background: var(--ink); color: #ffffff;
        padding: 12px 20px; border-bottom: 4px solid var(--accent);
      }
      .brand { font-size: 18px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
      .brand::before { content: "■"; color: var(--accent); margin-right: 10px; }
      .brand-sub { margin-left: 14px; font-size: 11px; font-weight: 400; letter-spacing: 1px; opacity: 0.65; text-transform: uppercase; }
      .shell { max-width: 960px; margin: 0 auto; padding: 24px 20px 48px; display: grid; gap: 16px; }
      /* Grid items default to min-width: auto, so any unbreakable long
         content inside (e.g. a <select>'s selected option text) would
         otherwise blow out this track and overflow the page horizontally
         on narrow screens instead of wrapping/shrinking. */
      .app { display: grid; gap: 16px; min-width: 0; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .hidden { display: none !important; }
      .muted { opacity: 0.6; font-size: 12px; }
      .hint { margin-top: 10px; font-size: 12px; opacity: 0.6; }
      .panel { background: var(--bg); border: 2px solid var(--ink); padding: 16px; min-width: 0; }
      .panel-title {
        font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
        border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 12px;
      }
      .panel-title::before { content: "■"; color: var(--accent); margin-right: 8px; }
      .pill {
        display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px;
        font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
        background: var(--bg); color: var(--ink); border: 1px solid var(--ink);
      }
      .topbar .pill { border-color: #ffffff; color: #ffffff; background: transparent; text-decoration: none; }
      .topbar .pill:hover { background: #ffffff; color: var(--ink); }
      a { color: var(--accent); }
      button {
        font: inherit; font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
        padding: 10px 16px; cursor: pointer; color: #ffffff; background: var(--accent); border: 2px solid var(--accent);
      }
      button.secondary { background: var(--bg); color: var(--ink); border-color: var(--ink); }
      button.secondary:hover:not(:disabled) { background: var(--ink); color: #ffffff; }
      button.caution { background: var(--bg); color: var(--warn); border-color: var(--warn); }
      button.caution:hover:not(:disabled) { background: var(--warn); color: #ffffff; border-color: var(--warn); }
      input, select { font: inherit; padding: 8px 10px; color: var(--ink); background: var(--bg); border: 2px solid var(--ink); }
      .error-banner { display: none; background: var(--ink); color: #ffffff; border-left: 6px solid var(--accent); padding: 10px 14px; font-size: 12px; }
      .today-list,
      .override-list { border: 1px solid var(--ink); }
      .today-row,
      .override-row {
        display: flex; justify-content: space-between; gap: 8px; align-items: center;
        padding: 8px 10px; border-bottom: 1px solid var(--ink);
      }
      .today-row:last-child,
      .override-row:last-child { border-bottom: none; }
      .today-slot { font-size: 12px; }
      .today-actions { display: flex; gap: 6px; }
      .today-actions button,
      .override-row button,
      .today-add-row button { padding: 6px 10px; font-size: 10px; }
      .today-row.swap-armed { background: var(--ink); color: #ffffff; }
      .today-add-row { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .today-add-row select,
      .today-add-row input { border: 1px solid var(--ink); padding: 8px; font: inherit; background: var(--bg); color: var(--ink); }
      .today-hint { margin-top: 8px; font-size: 12px; opacity: 0.6; }
      @media (max-width: 640px) {
        .shell { padding: 16px 12px 40px; }
        .brand-sub { display: block; margin-left: 0; margin-top: 2px; }
        /* Prevent iOS Safari auto-zoom on input focus (triggers below 16px). */
        input, select { font-size: 16px; }
        /* A long class name otherwise gets squeezed into a narrow column next
           to the Cancel/Swap/Undo buttons. Stack the actions below instead. */
        .today-row, .override-row { flex-wrap: wrap; }
        .today-slot { flex-basis: 100%; }
        /* The "add class" controls (course select, start/end time, button)
           default to shrink-to-content widths, which on a narrow phone
           produces a cramped, ragged wrap (e.g. the course select showing
           only its dropdown arrow with no room for the label). Give each
           control an explicit basis so they form a clean, full-width stack:
           select on its own line, start/end time side by side, button below. */
        .today-add-row select { flex: 1 1 100%; min-width: 0; }
        .today-add-row input[type="time"] { flex: 1 1 calc(50% - 4px); min-width: 0; }
        .today-add-row button { flex: 1 1 100%; }
      }
    </style>
  </head>
<!-- BODY -->
  <body>
    <header class="topbar">
      <div class="brand">Admiral<span class="brand-sub">Today</span></div>
      <div class="row">
        <a class="pill" href="/">&#8592; Status</a>
        <a class="pill" href="/participant-stats">Participant stats</a>
      </div>
    </header>

    <main class="shell">
      <div id="errorBanner" class="error-banner" role="alert"></div>

      <section id="loginCard" class="panel hidden">
        <div class="panel-title">Authentication</div>
        <div>Session expired or not logged in.</div>
        <div class="hint"><a href="/">Log in on the status page</a> &mdash; the session cookie is shared across pages.</div>
      </section>

      <section id="appCard" class="app hidden">
        <div class="panel">
          <div class="panel-title">Today</div>
          <div id="todayList" class="today-list"></div>
          <div id="todaySwapHint" class="today-hint hidden">Swap armed. Tap another slot to complete, or tap the same slot to cancel.</div>
          <div class="today-add-row">
            <select id="todayAddCourse"></select>
            <input id="todayAddStart" type="time" />
            <input id="todayAddEnd" type="time" />
            <button id="todayAddBtn" class="secondary">Add Class</button>
          </div>
          <div class="today-hint" style="margin-top: 12px">Applied today</div>
          <div id="todayOverrideList" class="override-list"></div>
        </div>
      </section>
    </main>

    <script src="/today.js" type="module"></script>
  </body>
</html>
